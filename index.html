      content="Personal academic homepage — research, publications, and more."
    />

    <!-- Prevent a flash of the wrong theme: read the saved theme before paint.
         Light / Dark, both warm. Falls back to the OS preference. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>

    <!-- Fonts: Inter (sans, headings + UI) + Lora (serif, body). Light & airy. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
